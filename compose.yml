# NorthLedger 完整本地业务拓扑：浏览器 -> 非 root Nginx/React -> Spring Boot -> MySQL/Redis。
# 监控栈由 compose.observability.yml 叠加，业务与观测边界保持清晰。
# Compose 项目标识沿用仓库目录名，以便原地升级并继续挂载既有持久化数据卷。

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: opspilot
      MYSQL_USER: opspilot
      # 没有显式密钥就拒绝启动，避免把仓库默认密码误带入长期环境。
      MYSQL_PASSWORD: ${DB_PASSWORD:?copy .env.example to .env and set DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    ports:
      # 主机使用 3307 避开常见的本地 MySQL 3306；容器间仍访问 mysql:3306。
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - opspilot
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  redis:
    # 固定补丁版本保证 ACL、AOF 和内存策略行为可复现，不使用会漂移的 latest。
    image: redis:7.4.10-alpine
    environment:
      # 密码只来自本机 .env；启动脚本把它转换为 ACL 哈希，不放入 redis-server 命令行。
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_MAXMEMORY: 128mb
      TZ: Asia/Shanghai
    entrypoint: ["/bin/sh", "/opt/northledger/redis-entrypoint.sh"]
    ports:
      # 仅供本机 redis-cli 学习和排障，局域网/公网无法直接连接。
      - "127.0.0.1:16379:6379"
    volumes:
      - ./deploy/redis/entrypoint.sh:/opt/northledger/redis-entrypoint.sh:ro
      - redis_data:/data
    tmpfs:
      # ACL 哈希文件仅存在于内存，容器删除后不会落入镜像层或数据卷。
      - /run/redis:size=1m,mode=0700
    networks:
      - opspilot
    healthcheck:
      # REDISCLI_AUTH 通过环境传给 redis-cli，不把密码显示在 ps 命令参数中。
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$REDIS_PASSWORD redis-cli -h 127.0.0.1 ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    read_only: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  app:
    build:
      context: .
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    image: northledger-api:${APP_VERSION:-dev}
    environment:
      APP_ENV: compose
      APP_VERSION: ${APP_VERSION:-dev}
      DB_URL: jdbc:mysql://mysql:3306/opspilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: opspilot
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # 同一 Redis 实例用独立命名空间保存会话与可重建的总览缓存。
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: default
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      REDIS_CONNECT_TIMEOUT: 1s
      REDIS_TIMEOUT: 1s
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?set BOOTSTRAP_ADMIN_USERNAME in .env}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?set BOOTSTRAP_ADMIN_PASSWORD in .env}
      BOOTSTRAP_ADMIN_DISPLAY_NAME: ${BOOTSTRAP_ADMIN_DISPLAY_NAME:-System Administrator}
      # Docker 标准输出使用 ECS JSON，Loki 可以按 event/outcome/trace.id 等字段查询。
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
      SERVER_ADDRESS: 0.0.0.0
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:18080:18080"
    networks:
      opspilot:
        # 前端镜像和 Kubernetes 都通过 opspilot-backend 解析后端，配置完全复用。
        aliases:
          - opspilot-backend
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: northledger-web:${APP_VERSION:-dev}
    ports:
      # 用户只需记住 18000，避免常见 80/8080 端口冲突。
      - "18000:8080"
    networks:
      - opspilot
    depends_on:
      app:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0777
      - /var/run:size=8m,mode=0777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped

networks:
  opspilot:
    name: opspilot_network

volumes:
  mysql_data:
    name: opspilot_mysql_data
  # AOF 保存会话与缓存重启状态；缓存可重建，但会话需要在普通容器重建后继续存在。
  redis_data:
    name: opspilot_redis_data
