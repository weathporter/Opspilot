# Grafana 数据源自动配置。容器启动时读取，无需在 UI 手工添加，环境可重复重建。
apiVersion: 1

# 删除配置文件中已移除的数据源，避免旧数据源长期残留并误导排障。
prune: true

datasources:
  - name: Prometheus
    # 稳定 UID 被 dashboard JSON 直接引用，修改会导致看板找不到数据源。
    uid: prometheus
    type: prometheus
    # proxy 表示浏览器请求先到 Grafana 后端，再由 Grafana 容器访问 Prometheus，用户无需直连数据源。
    access: proxy
    # Compose 内部 DNS + 容器端口；不能写 localhost，因为 Grafana 容器的 localhost 是它自己。
    url: http://prometheus:9090
    # 新建面板未指定数据源时默认使用 Prometheus。
    isDefault: true
    # 禁止 UI 修改，确保 Git 中配置是唯一事实来源。
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
