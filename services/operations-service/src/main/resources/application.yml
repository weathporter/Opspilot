# Operations 只读取 Ledger 内部统计接口；Redis 仅缓存可重建的只读投影。
spring:
  application:
    name: northledger-operations
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/northledger_operations?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${DB_USERNAME:northledger_operations}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Shanghai
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      username: ${REDIS_USERNAME:default}
      password: ${REDIS_PASSWORD}
      connect-timeout: 1s
      timeout: 1s

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:18082}
  shutdown: graceful

northledger:
  ledger:
    base-url: ${LEDGER_BASE_URL:http://localhost:18081}
  internal:
    # Access 调用 Operations 和 Operations 只读 Ledger 用不同凭据。
    access-token: ${INTERNAL_ACCESS_TOKEN}
    ledger-read-token: ${INTERNAL_OPERATIONS_READ_TOKEN}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          # 对账历史必须能写 MySQL；Redis 是可降级缓存，不纳入就绪判断。
          include: readinessState,db
        liveness:
          include: livenessState
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}
      version: ${APP_VERSION:dev}
    distribution:
      percentiles-histogram:
        http.server.requests: true

info:
  app:
    version: ${APP_VERSION:dev}
    environment: ${APP_ENV:local}

logging:
  pattern:
    correlation: "[%X{traceId:-}] "
    level: "%5p %kvp"
