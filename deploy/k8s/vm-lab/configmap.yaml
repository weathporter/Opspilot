apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-api-config
  labels:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: api
data:
  APP_ENV: vm-kubernetes-lab
  APP_VERSION: "0.1.1"
  DB_URL: jdbc:mysql://mysql:3306/opspilot?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
  DB_USERNAME: opspilot
  SERVER_ADDRESS: 0.0.0.0
  TZ: Asia/Shanghai
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-web-nginx
  labels:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: web
data:
  default.conf: |
    upstream opspilot_backend {
        server opspilot-backend:18080;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /health {
            proxy_pass http://opspilot_backend/actuator/health/readiness;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }

        location /api/ {
            proxy_pass http://opspilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        location /actuator/ {
            return 404;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
