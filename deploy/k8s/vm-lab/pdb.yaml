apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opspilot-api
  labels:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: opspilot-web
  labels:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: web
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: web
