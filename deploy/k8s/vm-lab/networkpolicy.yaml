apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-default-deny-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opspilot
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-allow-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: web
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-allow-api-from-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opspilot
              app.kubernetes.io/component: web
      ports:
        - protocol: TCP
          port: 18080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: opspilot-allow-mysql-from-api
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: database
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: opspilot
              app.kubernetes.io/component: api
      ports:
        - protocol: TCP
          port: 3306
