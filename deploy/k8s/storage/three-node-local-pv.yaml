# 静态本地 PV：先在对应 VM 创建并授权目录，再在控制平面 kubectl apply。
# Retain 防止误删 PVC 立即抹掉数据；它仍不提供跨节点复制或高可用。
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: northledger-local-mysql }
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata: { name: northledger-local-redis }
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: northledger-mysql-local-pv }
spec:
  capacity: { storage: 5Gi }
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: northledger-local-mysql
  local: { path: /var/lib/northledger/mysql }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nl-worker1] }
---
apiVersion: v1
kind: PersistentVolume
metadata: { name: northledger-redis-local-pv }
spec:
  capacity: { storage: 1Gi }
  volumeMode: Filesystem
  accessModes: [ReadWriteOnce]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: northledger-local-redis
  local: { path: /var/lib/northledger/redis }
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - { key: kubernetes.io/hostname, operator: In, values: [nl-worker2] }
