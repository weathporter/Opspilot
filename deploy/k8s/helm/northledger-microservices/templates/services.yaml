{{- range $name, $service := .Values.services }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: northledger-{{ $name }}
  labels:
    {{- include "northledger.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northledger-{{ $name }}
  labels:
    {{- include "northledger.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels:
      app.kubernetes.io/name: northledger
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: northledger
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: {{ $service.port | quote }}
    spec:
      serviceAccountName: northledger-{{ $name }}
      automountServiceAccountToken: false
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: northledger
              app.kubernetes.io/component: {{ $name }}
      containers:
        - name: {{ $name }}
          image: "{{ index $.Values.images $name }}:{{ $.Values.global.imageTag }}"
          imagePullPolicy: {{ $.Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: {{ $service.port }}, protocol: TCP }
          env:
            - { name: APP_ENV, value: {{ $.Values.global.environment | quote }} }
            - { name: APP_VERSION, value: {{ $.Values.global.version | quote }} }
            - { name: TZ, value: Asia/Shanghai }
            - name: DB_URL
              value: {{ printf "jdbc:mysql://%s:%v/%s?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false" $.Values.database.host $.Values.database.port $service.database | quote }}
            - { name: DB_USERNAME, value: {{ $service.dbUsername | quote }} }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: {{ $service.dbPasswordKey }} }
            {{- if eq $name "access" }}
            - { name: REDIS_HOST, value: {{ $.Values.redis.host | quote }} }
            - { name: REDIS_PORT, value: {{ $.Values.redis.port | quote }} }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: redis-password }
            - name: INTERNAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-access-token }
            - name: INTERNAL_OPERATIONS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-operations-token }
            - name: BOOTSTRAP_ADMIN_USERNAME
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: bootstrap-admin-username }
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: bootstrap-admin-password }
            - { name: LEDGER_BASE_URL, value: "http://northledger-ledger:18081" }
            - { name: OPERATIONS_BASE_URL, value: "http://northledger-operations:18082" }
            - { name: SESSION_COOKIE_SECURE, value: {{ $.Values.sessionCookieSecure | quote }} }
            {{- else if eq $name "ledger" }}
            - name: INTERNAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-access-token }
            - name: INTERNAL_OPERATIONS_READ_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-operations-read-token }
            {{- else if eq $name "operations" }}
            - { name: REDIS_HOST, value: {{ $.Values.redis.host | quote }} }
            - { name: REDIS_PORT, value: {{ $.Values.redis.port | quote }} }
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: redis-password }
            - name: INTERNAL_ACCESS_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-operations-token }
            - name: INTERNAL_OPERATIONS_READ_TOKEN
              valueFrom:
                secretKeyRef: { name: {{ $.Values.secretName }}, key: internal-operations-read-token }
            - { name: LEDGER_BASE_URL, value: "http://northledger-ledger:18081" }
            {{- end }}
          resources:
            {{- toYaml $service.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: tmp
          emptyDir: { sizeLimit: 64Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: northledger-{{ $name }}
  labels:
    {{- include "northledger.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: northledger
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $name }}
  ports:
    - { name: http, port: {{ $service.port }}, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: northledger-{{ $name }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: northledger
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $name }}
{{- end }}
