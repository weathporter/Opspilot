apiVersion: v1
kind: ServiceAccount
metadata:
  name: northledger-web
  labels:
    {{- include "northledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: northledger-web-nginx
  labels:
    {{- include "northledger.labels" . | nindent 4 }}
data:
  default.conf: |
    map $request_method $authentication_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $authentication_limit_key zone=authentication_limit:10m rate=10r/m;
    upstream northledger_access {
        server northledger-access:18080;
        keepalive 32;
    }
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

        location = /health {
            proxy_pass http://northledger_access/actuator/health/readiness;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }
        location = /api/v1/auth/session {
            limit_req zone=authentication_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://northledger_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location /api/ {
            proxy_pass http://northledger_access;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 30s;
        }
        location /internal/ { return 404; }
        location /actuator/ { return 404; }
        location /assets/ { try_files $uri =404; expires 1y; }
        location / { try_files $uri $uri/ /index.html; expires -1; }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: northledger-web
  labels:
    {{- include "northledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app.kubernetes.io/name: northledger, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  template:
    metadata:
      labels: { app.kubernetes.io/name: northledger, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
    spec:
      serviceAccountName: northledger-web
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: web }
      containers:
        - name: web
          image: "{{ .Values.images.web }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          ports:
            - { name: http, containerPort: 8080, protocol: TCP }
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: nginx-config, mountPath: /etc/nginx/conf.d/default.conf, subPath: default.conf, readOnly: true }
            - { name: nginx-cache, mountPath: /var/cache/nginx }
            - { name: nginx-run, mountPath: /var/run }
          startupProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: http }
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
            failureThreshold: 3
      volumes:
        - name: nginx-config
          configMap: { name: northledger-web-nginx }
        - name: nginx-cache
          emptyDir: { sizeLimit: 64Mi }
        - name: nginx-run
          emptyDir: { sizeLimit: 16Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: northledger-web
  labels:
    {{- include "northledger.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector: { app.kubernetes.io/name: northledger, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
  ports:
    - { name: http, port: 8080, targetPort: http, protocol: TCP }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: northledger-web
spec:
  minAvailable: 1
  selector:
    matchLabels: { app.kubernetes.io/name: northledger, app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: web }
