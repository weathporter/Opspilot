# Redis 承载 Access 会话和 Operations 可重建缓存；单副本 AOF 不等于高可用。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: northledger-redis
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: northledger-redis-startup
data:
  entrypoint.sh: |
{{ .Files.Get "files/redis-entrypoint.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: northledger-redis
  labels: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: redis }
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: redis }
  ports:
    - { name: redis, port: 6379, targetPort: redis, protocol: TCP }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: northledger-redis
  labels: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: redis }
spec:
  serviceName: northledger-redis
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: redis }
  template:
    metadata:
      labels: { app.kubernetes.io/name: northledger, app.kubernetes.io/component: redis }
      annotations:
        checksum/startup: {{ .Files.Get "files/redis-entrypoint.sh" | sha256sum }}
    spec:
      serviceAccountName: northledger-redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: redis
          image: {{ .Values.redis.image | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/opt/northledger/redis-entrypoint.sh"]
          ports:
            - { name: redis, containerPort: 6379, protocol: TCP }
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef: { name: {{ .Values.secretName }}, key: redis-password }
            - { name: REDIS_MAXMEMORY, value: {{ .Values.redis.maxmemory | quote }} }
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: runtime, mountPath: /run/redis }
            - { name: startup, mountPath: /opt/northledger/redis-entrypoint.sh, subPath: entrypoint.sh, readOnly: true }
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 15
            failureThreshold: 4
      volumes:
        - name: runtime
          emptyDir: { medium: Memory, sizeLimit: 2Mi }
        - name: startup
          configMap: { name: northledger-redis-startup, defaultMode: 0555 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.redis.storageClass | quote }}
        resources:
          requests:
            storage: {{ .Values.redis.storageSize }}
