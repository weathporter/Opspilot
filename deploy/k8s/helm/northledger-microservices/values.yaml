# 这是三节点实验环境的资源预算；1 控制平面 + 2 worker、单副本数据库并非生产 HA。
global:
  environment: three-node-lab
  version: dev
  imageTag: dev
  # GHCR 包公开时留空；私有包需预建 registry Secret，再填入名称。
  imagePullSecrets: []

images:
  access: ghcr.io/weathporter/opspilot-access
  ledger: ghcr.io/weathporter/opspilot-ledger
  operations: ghcr.io/weathporter/opspilot-operations
  web: ghcr.io/weathporter/opspilot-web
  pullPolicy: IfNotPresent

services:
  access:
    replicas: 2
    port: 18080
    database: northledger_access
    dbUsername: nl_access
    dbPasswordKey: access-db-password
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: 500m, memory: 512Mi }
  ledger:
    replicas: 2
    port: 18081
    database: northledger_ledger
    dbUsername: nl_ledger
    dbPasswordKey: ledger-db-password
    resources:
      requests: { cpu: 100m, memory: 192Mi }
      limits: { cpu: 500m, memory: 512Mi }
  operations:
    replicas: 2
    port: 18082
    database: northledger_operations
    dbUsername: nl_operations
    dbPasswordKey: operations-db-password
    resources:
      requests: { cpu: 75m, memory: 160Mi }
      limits: { cpu: 400m, memory: 448Mi }

web:
  replicas: 2
  port: 8080
  resources:
    requests: { cpu: 30m, memory: 48Mi }
    limits: { cpu: 200m, memory: 160Mi }

database:
  host: northledger-mysql
  port: 3306
  image: mysql:8.4
  # kubeadm 集群通常没有默认动态 provisioner；先按 Runbook 创建对应静态 PV。
  storageClass: northledger-local-mysql
  storageSize: 5Gi
  resources:
    requests: { cpu: 150m, memory: 512Mi }
    limits: { cpu: 750m, memory: 1Gi }

redis:
  host: northledger-redis
  port: 6379
  image: redis:7.4.10-alpine
  storageClass: northledger-local-redis
  storageSize: 1Gi
  maxmemory: 128mb
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }

# Secret 必须由部署者预先创建；Chart 和 values 中不保存真实密码、令牌或 kubeconfig。
secretName: northledger-runtime
sessionCookieSecure: false

ingress:
  enabled: true
  className: nginx
  host: northledger.local
  tlsSecretName: ""

networkPolicy:
  enabled: true
  monitoringNamespace: monitoring
  monitoringPodLabel: prometheus
