apiVersion: apps/v1
kind: Deployment
metadata:
  name: opspilot-api
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  # HPA 会在运行期调整副本数；replicaCount 是安装和 HPA 尚未接管时的初始值。
  replicas: {{ .Values.api.replicaCount }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # maxUnavailable=0 保证升级时至少保留旧版本容量，maxSurge=1 逐个创建新 Pod。
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspilot
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 普通 Prometheus 可依据注解发现指标；Prometheus Operator 环境也可扩展 ServiceMonitor。
        prometheus.io/scrape: "true"
        prometheus.io/path: "/actuator/prometheus"
        prometheus.io/port: "18080"
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: opspilot-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 35
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # 先等数据库端口真正可连接，再启动 Spring/Flyway，避免首次安装时因并行创建而产生无意义重启。
      # 复用 API 镜像内 Alpine BusyBox 的 nc，不额外引入一个需要从公网拉取的工具镜像。
      initContainers:
        - name: wait-for-database
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - >-
              until nc -z -w 2 "$DB_HOST" "$DB_PORT";
              do echo "waiting for database ${DB_HOST}:${DB_PORT}"; sleep 2; done
          env:
            - name: DB_HOST
              value: {{ .Values.database.host | quote }}
            - name: DB_PORT
              value: {{ .Values.database.port | quote }}
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 18080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: opspilot-api-config
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opspilot.databaseSecretName" . }}
                  key: database-password
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 2
          readinessProbe:
            # readiness 包含数据库依赖；失败时停止接收流量，但不会错误重启进程。
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            # liveness 只判断进程是否失去自我恢复能力，不把短暂 MySQL 故障等同于进程死亡。
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 2
          lifecycle:
            preStop:
              # 给 EndpointSlice 传播摘流状态留出短窗口，再由 Spring Boot 处理 SIGTERM。
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: opspilot
              app.kubernetes.io/component: api
---
apiVersion: v1
kind: Service
metadata:
  # 前端 Nginx 在 Compose 与 Kubernetes 中都使用这个稳定名称。
  name: opspilot-backend
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 18080
      targetPort: http
      protocol: TCP
