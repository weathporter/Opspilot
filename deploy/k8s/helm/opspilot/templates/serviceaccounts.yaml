apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-api
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-web
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- if .Values.mysql.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-mysql
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-redis
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- if .Values.redisExporter.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-redis-exporter
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
