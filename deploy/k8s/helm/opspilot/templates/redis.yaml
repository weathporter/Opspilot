{{- if .Values.redis.enabled }}
# 启动脚本来自 Chart 文件并以只读 ConfigMap 挂载；密码只从 Secret 注入，配置中没有可登录默认值。
apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-redis-startup
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
data:
  entrypoint.sh: |
{{ .Files.Get "files/redis-entrypoint.sh" | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: opspilot-redis
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: opspilot
    app.kubernetes.io/component: redis
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: opspilot-redis
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  serviceName: opspilot-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: opspilot
      app.kubernetes.io/component: redis
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: opspilot
        app.kubernetes.io/component: redis
        app.kubernetes.io/instance: {{ .Release.Name }}
      annotations:
        # 只校验启动脚本文件；不能 include 当前模板，否则会递归渲染自身。
        checksum/startup: {{ .Files.Get "files/redis-entrypoint.sh" | sha256sum }}
        # Chart 自建 Secret 时，密码变更会改变校验和并触发 Redis 滚动更新。
        # 使用 existingSecret 时 Helm 无法观察外部对象内容，需按 Runbook 协调重启。
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      serviceAccountName: opspilot-redis
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        # 官方 redis:alpine 镜像中的 redis 用户为 999:1000；fsGroup 让该用户可写 PVC/emptyDir。
        runAsUser: 999
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          command: ["/bin/sh", "/opt/northledger/redis-entrypoint.sh"]
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opspilot.databaseSecretName" . }}
                  key: redis-password
            - name: REDIS_MAXMEMORY
              value: {{ .Values.redis.maxmemory | quote }}
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /data
            - name: runtime
              mountPath: /run/redis
            - name: startup
              mountPath: /opt/northledger/redis-entrypoint.sh
              subPath: entrypoint.sh
              readOnly: true
          startupProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 3
            failureThreshold: 20
            timeoutSeconds: 2
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 5
            failureThreshold: 3
            timeoutSeconds: 2
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "REDISCLI_AUTH=\"$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
            periodSeconds: 15
            failureThreshold: 4
            timeoutSeconds: 2
      volumes:
        - name: runtime
          emptyDir:
            medium: Memory
            sizeLimit: 2Mi
        - name: startup
          configMap:
            name: opspilot-redis-startup
            defaultMode: 0555
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.redis.persistence.storageClass }}
        storageClassName: {{ .Values.redis.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.redis.persistence.size }}
{{- end }}
