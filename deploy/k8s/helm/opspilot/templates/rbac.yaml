{{- if .Values.operatorRbac.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: opspilot-operator
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opspilot-operator
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
rules:
  # 排障人员可以查看 Pod、日志、Service、事件和工作负载状态，但不能读取 Secret。
  - apiGroups: [""]
    resources: ["pods", "pods/log", "services", "endpoints", "events", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets"]
    verbs: ["get", "list", "watch"]
  # 仅允许对 Deployment 做 patch，用于受控 rollout restart；不允许创建或删除工作负载。
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: opspilot-operator
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: opspilot-operator
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: opspilot-operator
{{- end }}
