apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-api-config
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
data:
  # 配置和密钥分开：ConfigMap 只保存可公开的连接地址、环境和版本。
  APP_ENV: {{ .Values.global.environment | quote }}
  APP_VERSION: {{ .Values.global.version | quote }}
  DB_URL: {{ printf "jdbc:mysql://%s:%v/%s?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false" .Values.database.host .Values.database.port .Values.database.name | quote }}
  DB_USERNAME: {{ .Values.database.username | quote }}
  REDIS_HOST: {{ .Values.redis.host | quote }}
  REDIS_PORT: {{ .Values.redis.port | quote }}
  REDIS_USERNAME: {{ .Values.redis.username | quote }}
  SPRING_DATA_REDIS_SSL_ENABLED: {{ .Values.redis.tls.enabled | quote }}
  {{- if .Values.redis.tls.trustStore.enabled }}
  # 受管 Redis 使用企业私有 CA 时，Spring Boot 通过命名 SSL bundle 读取只读 truststore。
  SPRING_DATA_REDIS_SSL_BUNDLE: "redis"
  SPRING_SSL_BUNDLE_JKS_REDIS_TRUSTSTORE_LOCATION: "file:/var/run/secrets/northledger/redis/truststore.p12"
  SPRING_SSL_BUNDLE_JKS_REDIS_TRUSTSTORE_TYPE: "PKCS12"
  {{- end }}
  REDIS_CONNECT_TIMEOUT: "1s"
  REDIS_TIMEOUT: "1s"
  SERVER_ADDRESS: "0.0.0.0"
  TZ: "Asia/Shanghai"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: opspilot-web-nginx
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
data:
  # Kubernetes Service ClusterIP 稳定，因此无需使用 Docker 专属的 127.0.0.11 resolver。
  default.conf: |
    map $request_method $authentication_limit_key {
        default "";
        POST $binary_remote_addr;
    }
    limit_req_zone $authentication_limit_key zone=authentication_limit:10m rate=10r/m;
    upstream opspilot_backend {
        server opspilot-backend:18080;
        keepalive 32;
    }
    server {
        listen 8080;
        server_name _;
        server_tokens off;
        root /usr/share/nginx/html;
        index index.html;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

        location = /health {
            proxy_pass http://opspilot_backend/actuator/health/readiness;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $request_id;
            access_log off;
        }
        location = /api/v1/auth/session {
            limit_req zone=authentication_limit burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://opspilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        location /api/ {
            proxy_pass http://opspilot_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        location /actuator/ { return 404; }
        location /assets/ {
            try_files $uri =404;
            expires 1y;
        }
        location / {
            try_files $uri $uri/ /index.html;
            expires -1;
        }
    }
