{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: opspilot-database
  labels:
    {{- include "opspilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Helm 渲染时强制显式提供，避免仓库内出现可登录默认密码。
  database-password: {{ required "secrets.databasePassword is required" .Values.secrets.databasePassword | quote }}
  {{- if .Values.mysql.enabled }}
  # 只有 Chart 同时创建内置 MySQL 时才需要 root 密码；外部数据库由平台侧独立治理。
  mysql-root-password: {{ required "secrets.mysqlRootPassword is required when mysql.enabled=true" .Values.secrets.mysqlRootPassword | quote }}
  {{- end }}
  bootstrap-admin-username: {{ required "secrets.bootstrapAdminUsername is required" .Values.secrets.bootstrapAdminUsername | quote }}
  bootstrap-admin-password: {{ required "secrets.bootstrapAdminPassword is required" .Values.secrets.bootstrapAdminPassword | quote }}
  bootstrap-admin-display-name: {{ .Values.secrets.bootstrapAdminDisplayName | quote }}
{{- end }}
