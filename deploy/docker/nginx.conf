# Docker 网络中统一使用 opspilot-backend 别名；Kubernetes Service 也使用同名地址。
# 这样同一前端镜像可以跨 Compose 与 Kubernetes 运行，不需要启动时改写配置。
resolver 127.0.0.11 valid=10s ipv6=off;

# 空 key 不参与限流，因此只约束真正提交密码的 POST，不影响页面刷新时的会话查询或正常退出。
map $request_method $authentication_limit_key {
    default "";
    POST $binary_remote_addr;
}
# 认证入口按客户端地址限流：稳定速率每分钟 10 次，短时最多额外容纳 5 次手误重试。
limit_req_zone $authentication_limit_key zone=authentication_limit:10m rate=10r/m;

upstream opspilot_backend {
    # zone 允许 Nginx 在运行期保存 DNS 重新解析结果，后端容器重建后无需重启前端。
    zone opspilot_backend 64k;
    server opspilot-backend:18080 resolve;
    keepalive 32;
}

server {
    # 使用非特权端口，配合 Dockerfile 的 nginx 用户运行，避免容器主进程拥有 root 权限。
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    # readiness 是外部唯一健康入口；不把完整 Actuator 管理面暴露给浏览器。
    location = /health {
        proxy_pass http://opspilot_backend/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    # 登录、退出与会话查询共用同一路径；限流主要抑制密码爆破，正常页面只会发少量请求。
    location = /api/v1/auth/session {
        limit_req zone=authentication_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://opspilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 业务 API 保留原始 /api 路径，并传递真实来源、协议和统一请求 ID。
    location /api/ {
        proxy_pass http://opspilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        return 404;
    }

    # 内容哈希静态资源可长期缓存；文件名变化即代表新版本，不会命中旧缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    # BrowserRouter 的前端路径都回退到 index.html，再由 React 路由处理。
    location / {
        try_files $uri $uri/ /index.html;
        # expires -1 生成 no-cache，同时不会触发 add_header 的位置级继承覆盖。
        expires -1;
    }
}
