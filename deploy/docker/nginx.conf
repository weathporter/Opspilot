# Docker 网络中统一使用 opspilot-backend 别名；Kubernetes Service 也使用同名地址。
# 这样同一前端镜像可以跨 Compose 与 Kubernetes 运行，不需要启动时改写配置。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream opspilot_backend {
    # zone 允许 Nginx 在运行期保存 DNS 重新解析结果，后端容器重建后无需重启前端。
    zone opspilot_backend 64k;
    server opspilot-backend:18080 resolve;
    keepalive 32;
}

server {
    # 使用非特权端口，配合 Dockerfile 的 nginx 用户运行，避免容器主进程拥有 root 权限。
    listen 8080;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # readiness 是外部唯一健康入口；不把完整 Actuator 管理面暴露给浏览器。
    location = /health {
        proxy_pass http://opspilot_backend/actuator/health/readiness;
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        access_log off;
    }

    # 业务 API 保留原始 /api 路径，并传递真实来源、协议和统一请求 ID。
    location /api/ {
        proxy_pass http://opspilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /actuator/ {
        return 404;
    }

    # 内容哈希静态资源可长期缓存；文件名变化即代表新版本，不会命中旧缓存。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # BrowserRouter 的前端路径都回退到 index.html，再由 React 路由处理。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
