# Linux 原生部署的 Nginx 反向代理配置；Java 只监听 127.0.0.1:18080。

# 空 key 不计数，仅限制真正提交密码的 POST 请求，不影响读取会话或退出。
map $request_method $authentication_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $authentication_limit_key zone=authentication_limit:10m rate=10r/m;

upstream opspilot_backend {
    # 同主机回环通信，不暴露 Java 端口到外网。
    server 127.0.0.1:18080;
    # 复用到后端的空闲连接，减少每个请求重复 TCP 握手。
    keepalive 32;
}

server {
    # 对外 HTTP 入口；生产如启用 HTTPS，应另加 443 server 和证书配置，并重定向 80。
    listen 80;
    server_name _;
    server_tokens off;

    # 单独日志文件便于按应用检索、轮转和打包诊断。
    access_log /var/log/nginx/opspilot_access.log;
    error_log /var/log/nginx/opspilot_error.log warn;

    # React 与 JAR 位于同一个 current 版本目录，原子切换软链接即可同步升级或回滚。
    root /opt/opspilot/current/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; font-src 'self'; style-src 'self'; script-src 'self'; connect-src 'self'" always;

    # 部署门禁和负载均衡健康检查入口，同时验证 Nginx 到应用的完整链路。
    location = /health {
        proxy_pass http://opspilot_backend/actuator/health/readiness;
        # 必须传合法 Host；此前使用含下划线的 upstream 名会被 Tomcat 判为 400。
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # 高频探针不写 access log，避免无效日志和磁盘 IO。
        access_log off;
    }

    # 管理端点只允许本机直连 Java 诊断，外部经 Nginx 统一返回 404。
    location /actuator/ {
        return 404;
    }

    # 密码提交按来源地址限流；其余认证方法仍使用同一路径但空 key 不会计数。
    location = /api/v1/auth/session {
        limit_req zone=authentication_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://opspilot_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 普通业务 API 反向代理规则。
    location /api/ {
        proxy_pass http://opspilot_backend;
        # upstream keepalive 需要 HTTP/1.1。
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 把真实客户端链路信息传给 Spring，便于日志、审计和生成正确外部地址。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx 生成请求 ID，应用将其加入 MDC 与响应头。
        proxy_set_header X-Request-ID $request_id;
        # 连接失败快速返回；读写超时限制慢后端长期占用 Nginx worker 连接。
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # 内容哈希资源长期缓存；BrowserRouter 页面路径回退到同版本 index.html。
    location /assets/ {
        try_files $uri =404;
        expires 1y;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # 使用 expires 生成 no-cache，避免位置级 add_header 覆盖上层全部安全响应头。
        expires -1;
    }
}
