# Linux 原生部署的 Nginx 反向代理配置；Java 只监听 127.0.0.1:18080。

upstream opspilot_backend {
    # 同主机回环通信，不暴露 Java 端口到外网。
    server 127.0.0.1:18080;
    # 复用到后端的空闲连接，减少每个请求重复 TCP 握手。
    keepalive 32;
}

server {
    # 对外 HTTP 入口；生产如启用 HTTPS，应另加 443 server 和证书配置，并重定向 80。
    listen 80;
    server_name _;
    server_tokens off;

    # 单独日志文件便于按应用检索、轮转和打包诊断。
    access_log /var/log/nginx/opspilot_access.log;
    error_log /var/log/nginx/opspilot_error.log warn;

    # 部署门禁和负载均衡健康检查入口，同时验证 Nginx 到应用的完整链路。
    location = /health {
        proxy_pass http://opspilot_backend/actuator/health/readiness;
        # 必须传合法 Host；此前使用含下划线的 upstream 名会被 Tomcat 判为 400。
        proxy_set_header Host $host;
        proxy_set_header X-Request-ID $request_id;
        # 高频探针不写 access log，避免无效日志和磁盘 IO。
        access_log off;
    }

    # 管理端点只允许本机直连 Java 诊断，外部经 Nginx 统一返回 404。
    location /actuator/ {
        return 404;
    }

    # 普通业务 API 反向代理规则。
    location / {
        proxy_pass http://opspilot_backend;
        # upstream keepalive 需要 HTTP/1.1。
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 把真实客户端链路信息传给 Spring，便于日志、审计和生成正确外部地址。
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Nginx 生成请求 ID，应用将其加入 MDC 与响应头。
        proxy_set_header X-Request-ID $request_id;
        # 连接失败快速返回；读写超时限制慢后端长期占用 Nginx worker 连接。
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
