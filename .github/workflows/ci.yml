name: NorthLedger CI

on:
  push:
    branches: [main]
  pull_request:

# 默认只读仓库内容；CI 不需要写包、改代码或读取环境 Secret。
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Java and real MySQL tests
        # GitHub 的 Ubuntu runner 已提供 Docker；Testcontainers 会启动临时 MySQL 8.4。
        run: mvn -B -ntp test

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Restore frontend dependencies without install scripts
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Reject reachable high or critical npm advisories
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Build React production assets
        working-directory: frontend
        run: npm run build

      - name: Validate atomic Linux API and web release contract
        shell: pwsh
        run: ./scripts/tests/validate-linux-release.ps1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.18.6

      - name: Lint Kubernetes package with ephemeral test values
        run: >-
          helm lint deploy/k8s/helm/opspilot
          --set-string secrets.databasePassword=ci-database-password
          --set-string secrets.mysqlRootPassword=ci-root-password
          --set-string secrets.bootstrapAdminPassword=ci-bootstrap-password

      - name: Build immutable API and web images
        run: |
          docker build --build-arg APP_VERSION=${{ github.sha }} -t northledger-api:${{ github.sha }} .
          docker build -f frontend/Dockerfile -t northledger-web:${{ github.sha }} .
